<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quan Ly San Pham StudyMart</title>
    <!-- Nhung Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS chu dao Xanh - Trang -->
    <style>
        body { background-color: #f4f7f6; font-family: Arial, sans-serif; }
        .navbar { background-color: #0d6efd !important; } /* Xanh duong chu dao */
        .navbar-brand, .nav-link { color: #ffffff !important; }
        .nav-link:hover { color: #cfe2ff !important; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-primary-custom { background-color: #0d6efd; color: white; }
        .table img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Thanh dieu huong Admin (Xanh duong) -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">StudyMart Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active fw-bold" href="admin-products.html">San Pham</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-orders.html">Don Hang</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Thong Ke</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Noi dung trang -->
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary fw-bold">Quản Lý Sản Phẩm Đồ Dùng Học Tập</h2>
            <button class="btn btn-primary fw-bold shadow-sm">+ Thêm sản phẩm mới</button>
        </div>

        <!-- Bang danh sach san pham (Trang - Xanh) -->
        <div class="card bg-white">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-primary-custom">
                            <tr>
                                <th class="ps-3">ID</th>
                                <th>Hinh anh</th>
                                <th>Ten san pham</th>
                                <th>Gia (VND)</th>
                                <th>Ton kho</th>
                                <th class="text-center">Hanh dong</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="ps-3">1</td>
                                <td><img src="https://via.placeholder.com/50" alt="product"></td>
                                <td class="fw-semibold">But bi thien long</td>
                                <td class="text-primary fw-bold">5,000</td>
                                <td>100</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1">Sua</button>
                                    <button class="btn btn-sm btn-outline-danger">Xoa</button>
                                </td>
                            </tr>
                            <tr>
                                <td class="ps-3">2</td>
                                <td><img src="https://via.placeholder.com/50" alt="product"></td>
                                <td class="fw-semibold">Vo 96 trang Hong Ha</td>
                                <td class="text-primary fw-bold">12,000</td>
                                <td>50</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1">Sua</button>
                                    <button class="btn btn-sm btn-outline-danger">Xoa</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhung Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

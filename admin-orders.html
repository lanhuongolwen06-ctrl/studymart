<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quan Ly Don Hang StudyMart</title>
    <!-- Nhung Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS chu dao Xanh - Trang -->
    <style>
        body { background-color: #f4f7f6; font-family: Arial, sans-serif; }
        .navbar { background-color: #0d6efd !important; } /* Xanh duong chu dao */
        .navbar-brand, .nav-link { color: #ffffff !important; }
        .nav-link:hover { color: #cfe2ff !important; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table-primary-custom { background-color: #0d6efd; color: white; }
    </style>
</head>
<body>

    <!-- Thanh dieu huong Admin (Xanh duong) -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">StudyMart Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="admin-products.html">San Pham</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="admin-orders.html">Don Hang</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Thong Ke</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Noi dung trang quan ly don hang -->
    <div class="container my-5">
        <h2 class="text-primary fw-bold mb-4">Quản Lý Đơn Hàng Khách Hàng</h2>

        <!-- Bang danh sach don hang -->
        <div class="card bg-white">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-primary-custom">
                            <tr>
                                <th class="ps-3">Ma Don</th>
                                <th>Khach Hang</th>
                                <th>So Dien Thoai</th>
                                <th>Tong Tien (VND)</th>
                                <th>Trang Thai</th>
                                <th class="text-center">Hanh Dong</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Don hang mau 1 -->
                            <tr>
                                <td class="ps-3 fw-bold">#DH001</td>
                                <td>Nguyen Van A</td>
                                <td>0912345678</td>
                                <td class="text-primary fw-bold">65,000</td>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option value="pending" selected>Pending (Cho xu ly)</option>
                                        <option value="shipping">Shipping (Dang giao)</option>
                                        <option value="completed">Completed (Hoan thanh)</option>
                                        <option value="cancelled">Cancelled (Da huy)</option>
                                    </select>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary">Chi tiet</button>
                                </td>
                            </tr>
                            <!-- Don hang mau 2 -->
                            <tr>
                                <td class="ps-3 fw-bold">#DH002</td>
                                <td>Tran Thi B</td>
                                <td>0987654321</td>
                                <td class="text-primary fw-bold">120,000</td>
                                <td>
                                    <select class="form-select form-select-sm">
                                        <option value="pending">Pending (Cho xu ly)</option>
                                        <option value="shipping" selected>Shipping (Dang giao)</option>
                                        <option value="completed">Completed (Hoan thanh)</option>
                                        <option value="cancelled">Cancelled (Da huy)</option>
                                    </select>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary">Chi tiet</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhung Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
